# Project-wide Gradle settings.
# Enable parallel builds and daemon for faster builds
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true

# JVM memory settings optimized for Android builds
#org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxHeapFreeRatio=20 -XX:MinHeapFreeRatio=10 -XX:+AggressiveOpts

# Android settings
android.useAndroidX=true
android.enableJetifier=false

# Kotlin settings
kotlin.code.style=official
# Set the default Kotlin compiler execution strategy
# 'daemon' is the default and generally the best for performance.
kotlin.compiler.execution.strategy=daemon